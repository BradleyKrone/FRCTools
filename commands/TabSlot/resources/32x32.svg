<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="32" height="32" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Slot plate, seen from above, with two dogboned slots -->
  <rect x="2" y="16" width="28" height="12" rx="1" fill="#5b9bd5" fill-opacity="0.85" stroke="#1a5276" stroke-width="1.5"/>
  <!-- Tab plate standing on it, two tabs dropping into the slots -->
  <path d="M 5,3 H 27 V 18 H 23 V 24 H 18 V 18 H 14 V 24 H 9 V 18 H 5 Z"
        fill="#f0a830" stroke="#8a5a00" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Dogbone hints at the tab roots -->
  <circle cx="9" cy="18" r="1.2" fill="#ffffff" stroke="#8a5a00" stroke-width="0.8"/>
  <circle cx="14" cy="18" r="1.2" fill="#ffffff" stroke="#8a5a00" stroke-width="0.8"/>
  <circle cx="18" cy="18" r="1.2" fill="#ffffff" stroke="#8a5a00" stroke-width="0.8"/>
  <circle cx="23" cy="18" r="1.2" fill="#ffffff" stroke="#8a5a00" stroke-width="0.8"/>
</svg>
